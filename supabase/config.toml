project_id = "ojhxziejichxbubmdxdb"

# Auth URL configuration.
#
# The hosted project reads these from the Supabase dashboard
# (Authentication -> URL Configuration), so update them there for the change to
# take effect. This block documents the intended values and is what `supabase
# config push` would apply.
#
# site_url is the fallback that every confirmation/recovery link redirects to
# when the requested path isn't allow-listed below. additional_redirect_urls
# must include the exact paths (with a /** wildcard) the app sends users to:
# /applications after signup and /reset-password after a password reset.
# NOTE: this app's dev server runs on port 8080 (see .claude/launch.json), but
# the hosted project's Site URL was still http://localhost:3000 — that mismatch
# is why email links landed on a "site can't be reached" page.
#
# site_url should be the deployed domain so links work for real users; localhost
# stays in additional_redirect_urls for local dev.
[auth]
site_url = "https://job-tracker-rho-khaki-34.vercel.app"
additional_redirect_urls = [
  "https://job-tracker-rho-khaki-34.vercel.app/**",
  "http://localhost:8080/**",
]