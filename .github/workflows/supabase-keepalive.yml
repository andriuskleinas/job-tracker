name: Supabase keepalive

on:
  schedule:
    # Three times a day. Supabase pauses free projects after ~7 days without
    # database activity and doesn't guarantee that a read resets the timer,
    # so earlier read-only pings (every 5, then every 3 days) still let the
    # project get paused. Each run now makes a real write: the
    # record_keepalive_ping() RPC bumps a timestamp on a one-row table
    # (supabase/migrations/20261004120000_keepalive_ping.sql).
    - cron: "17 2,10,18 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write a heartbeat row via RPC
        run: |
          status=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${SUPABASE_URL}/rest/v1/rpc/record_keepalive_ping")
          echo "record_keepalive_ping responded with HTTP $status"
          if [ "$status" != "200" ] && [ "$status" != "204" ]; then
            echo "Unexpected response from Supabase"
            exit 1
          fi
        env:
          SUPABASE_URL: https://ojhxziejichxbubmdxdb.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_WmrrRztiCjckh4yU3EtQbw_LUlokhe_
