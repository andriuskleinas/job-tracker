name: Supabase keepalive

on:
  schedule:
    # every 3 days at 09:17 UTC — a wide safety margin under the 7-day
    # auto-pause threshold even if a run is skipped or delayed; the previous
    # every-5-days schedule still let the project get paused (see git log),
    # possibly because the identical repeated GET was served from a CDN/edge
    # cache instead of reaching the Supabase backend, so no-cache headers
    # were added below too. The REST ping takes no cache-busting param:
    # PostgREST parses unknown query params as column filters and returns
    # 400 (PGRST100); its responses are not edge-cached (cf-cache-status:
    # DYNAMIC) anyway.
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sS -f \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Cache-Control: no-cache, no-store" \
            -H "Pragma: no-cache" \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1"
        env:
          SUPABASE_URL: https://ojhxziejichxbubmdxdb.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_WmrrRztiCjckh4yU3EtQbw_LUlokhe_
      - name: Ping Supabase Auth health endpoint
        run: |
          curl -sS -f \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Cache-Control: no-cache, no-store" \
            "${SUPABASE_URL}/auth/v1/health?_cb=$(date +%s)-${GITHUB_RUN_ID}"
        env:
          SUPABASE_URL: https://ojhxziejichxbubmdxdb.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_WmrrRztiCjckh4yU3EtQbw_LUlokhe_
